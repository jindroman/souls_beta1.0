const RAD2D="<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Absolute Radiance \u2014 2D<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml,body{height:100%;margin:0;background:#05060a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Georgia,serif}\n#c{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}\n#touch{display:none;position:absolute;inset:0;pointer-events:none}\nbody.touch #touch{display:block}\n.b{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #fff6;background:#ffffff18;color:#fff;font:700 13px sans-serif;display:flex;align-items:center;justify-content:center}\n#bl{left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}\n#br{left:calc(env(safe-area-inset-left,0px) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}\n#bj{right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}\n#ba{right:calc(env(safe-area-inset-right,0px) + 92px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}\n#bd{right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}\n<\/style><\/head><body>\n<canvas id=\"c\"><\/canvas>\n<div id=\"touch\">\n<div class=\"b\" id=\"bl\">\u25c0<\/div><div class=\"b\" id=\"br\">\u25b6<\/div>\n<div class=\"b\" id=\"bj\">JUMP<\/div><div class=\"b\" id=\"ba\">HIT<\/div><div class=\"b\" id=\"bd\">DASH<\/div>\n<\/div>\n<script>\nconst cv=document.getElementById('c'),g=cv.getContext('2d');\nconst W=960,H=540,GY=440;\ncv.width=W;cv.height=H;\nif(('ontouchstart' in window)||navigator.maxTouchPoints>0)document.body.classList.add('touch');\nfunction fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.left=(innerWidth-W*s)/2+'px';cv.style.top=(innerHeight-H*s)/2+'px'}\naddEventListener('resize',fit);fit();\n\n// ---------- input (left = left, right = right; no inversion) ----------\nconst K={},P={};\naddEventListener('keydown',e=>{K[e.code]=1;if(e.code==='Space')e.preventDefault()});\naddEventListener('keyup',e=>K[e.code]=0);\n[['bl','L'],['br','R'],['bj','J'],['ba','A'],['bd','D']].forEach(([id,k])=>{\n const el=document.getElementById(id);\n el.addEventListener('touchstart',e=>{e.preventDefault();P[k]=1},{passive:false});\n const up=e=>{e.preventDefault();P[k]=0};\n el.addEventListener('touchend',up,{passive:false});el.addEventListener('touchcancel',up,{passive:false});\n});\nconst inL=()=>K.ArrowLeft||K.KeyA||P.L, inR=()=>K.ArrowRight||K.KeyD||P.R;\nconst inJ=()=>K.Space||K.ArrowUp||K.KeyW||P.J, inA=()=>K.KeyX||K.KeyJ||P.A, inD=()=>K.KeyC||K.KeyK||P.D;\n\n// ---------- audio (tiny synth, original) ----------\nlet ac;function snd(f,d,t='sine',v=.08,s=0){try{ac=ac||new AudioContext();const o=ac.createOscillator(),a=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+s),ac.currentTime+d);a.gain.setValueAtTime(v,ac.currentTime);a.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}\n\n// ---------- state ----------\nconst pl={x:200,y:GY,vx:0,vy:0,face:1,hp:5,inv:0,atk:0,dash:0,dcd:0,air:false,hurt:0,jh:false};\nconst bs={x:700,y:250,hp:700,max:700,st:'intro',t:0,face:-1,atk:null,ph:1,flash:0,sx:0,dead:0};\nlet projs=[],rays=[],parts=[],shake=0,stop=0,T=0,over=0,camx=0,msg='';\nconst plats=[{x:130,y:330,w:170},{x:660,y:330,w:170}];\nfunction setS(s,t){bs.st=s;bs.t=t||0}\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nfunction spawn(x,y,vx,vy,l,c,r){if(parts.length<400)parts.push({x,y,vx,vy,l,m:l,c,r})}\n\n// ---------- boss AI: every attack = prep -> active -> recover ----------\nconst ATK={\n orbs:{prep:.7,act:.1,rec:.6},\n rays:{prep:.9,act:.35,rec:.7},\n sweep:{prep:.8,act:.5,rec:.9},\n rain:{prep:.8,act:1.4,rec:.8}\n};\nfunction pick(){\n const pool=['orbs','rays','sweep'];if(bs.ph>=2)pool.push('rays','orbs');if(bs.ph>=3)pool.push('rain');\n bs.atk=pool[Math.floor(Math.random()*pool.length)];\n // reposition first (teleport), then attack\n setS('tpOut',0);\n}\nfunction startAtk(){\n const a=bs.atk;bs.fired=false;\n if(a==='rays'){rays=[];const n=bs.ph+2;for(let i=0;i<n;i++){const x=i===0?pl.x:rnd(60,W-60);rays.push({x,w:34,t:0,on:false})}}\n if(a==='sweep'){bs.sweepDir=pl.x<bs.x?-1:1;}\n setS('prep',0);snd(180,.6,'sawtooth',.05,300);\n}\nfunction bossHit(d){\n if(bs.st==='dead'||bs.st==='trans'||bs.st==='intro')return;\n bs.hp-=d;bs.flash=.12;snd(300,.1,'square',.06,-150);\n for(let i=0;i<10;i++)spawn(bs.x,bs.y,rnd(-200,200),rnd(-200,200),.5,'#fff6c8',2);\n if(bs.hp<=0){bs.hp=0;setS('dead',0);projs=[];rays=[];return}\n const np=bs.hp<bs.max*.34?3:bs.hp<bs.max*.67?2:1;\n if(np>bs.ph){bs.ph=np;projs=[];rays=[];setS('trans',0);msg=np===2?'THE LIGHT BURNS BRIGHTER':'NO...';snd(90,2,'sawtooth',.08,60)}\n else if(bs.st==='idle'||bs.st==='tpIn'){/* light stagger only while idle: no stunlock */ if(bs.st==='idle')bs.t=Math.max(0,bs.t-.3)}\n}\n\nfunction updBoss(dt){\n bs.t+=dt;bs.flash=Math.max(0,bs.flash-dt);\n bs.face=pl.x<bs.x?-1:1;\n bs.sx=Math.sin(T*1.3)*6;\n const idleY=250+Math.sin(T*1.7)*10;\n switch(bs.st){\n  case 'intro': // rises from the arena floor, camera holds\n   bs.y=GY+120-Math.min(1,bs.t/3)*(GY+120-idleY);\n   if(Math.random()<.5)spawn(rnd(0,W),H,0,-rnd(40,120),2,'#ffe9a0',2);\n   if(bs.t>3.4){setS('idle',0);msg=''}break;\n  case 'idle':bs.y=idleY;if(bs.t>(.9-bs.ph*.1)){pick()}break;\n  case 'tpOut':if(bs.t>.25){\n     // choose destination by attack\n     bs.x=bs.atk==='sweep'?(pl.x<W/2?W-120:120):bs.atk==='rain'?W/2:rnd(160,W-160);\n     bs.y=bs.atk==='sweep'?GY-70:idleY;setS('tpIn',0)}break;\n  case 'tpIn':if(bs.t>.25)startAtk();break;\n  case 'prep':if(bs.t>ATK[bs.atk].prep){setS('act',0);snd(520,.3,'sawtooth',.06,-300)}break;\n  case 'act':{\n    const a=bs.atk,A=ATK[a];\n    if(a==='orbs'&&!bs.fired){bs.fired=true;const n=3+bs.ph*2,base=Math.atan2(pl.y-30-bs.y,pl.x-bs.x);\n      for(let i=0;i<n;i++){const an=base+(i-(n-1)/2)*.22;projs.push({x:bs.x,y:bs.y,vx:Math.cos(an)*300,vy:Math.sin(an)*300,r:10,l:4})}}\n    if(a==='rays')rays.forEach(r=>{r.t=bs.t;r.on=bs.t>.02});\n    if(a==='rain'&&bs.t%.18<dt&&projs.length<40)projs.push({x:rnd(40,W-40),y:-10,vx:0,vy:rnd(220,320),r:9,l:4});\n    if(bs.t>A.act)setS('rec',0);break}\n  case 'rec':rays=[];if(bs.t>ATK[bs.atk].rec)setS('idle',0);break;\n  case 'trans': // stops, body ignites, camera pulls in; no gameplay until it finishes\n   shake=Math.max(shake,3);if(Math.random()<.8)spawn(bs.x+rnd(-40,40),bs.y+rnd(-60,60),rnd(-90,90),rnd(-140,-20),1,'#fff',2);\n   if(bs.t>2.6){setS('idle',0);msg=''}break;\n  case 'dead':\n   bs.dead+=dt;shake=bs.t<2.5?2:0;\n   if(Math.random()<.9)spawn(bs.x+rnd(-50,50),bs.y+rnd(-70,70),rnd(-120,120),rnd(-160,40),1.6,'#ffe9a0',2);\n   if(bs.t>5&&!over){over=1;msg='RADIANCE FADES';parent.postMessage({cg2d:'win',t:T},'*')}break;\n }\n}\n\n// ---------- player ----------\nfunction solid(x,y,py){ // returns landing y or null\n if(py<=GY&&y>=GY)return GY;\n for(const p of plats)if(x>p.x&&x<p.x+p.w&&py<=p.y&&y>=p.y)return p.y;return null}\nfunction updPlayer(dt){\n pl.inv=Math.max(0,pl.inv-dt);pl.hurt=Math.max(0,pl.hurt-dt);pl.dcd=Math.max(0,pl.dcd-dt);\n const dir=(inR()?1:0)-(inL()?1:0);\n if(pl.dash>0){pl.dash-=dt;pl.vx=pl.face*620;pl.vy=0;pl.inv=Math.max(pl.inv,.05)}\n else{\n  if(pl.hurt<=0){pl.vx+=(dir*270-pl.vx)*Math.min(1,dt*(pl.air?7:14));if(dir)pl.face=dir}\n  if(inD()&&pl.dcd<=0&&!over){pl.dash=.16;pl.dcd=.55;snd(240,.15,'triangle',.05,-120)}\n  pl.vy+=1900*dt;\n  if(inJ()&&!pl.air){pl.vy=-640;pl.air=true;pl.jh=true;snd(380,.12,'triangle',.04,150)}\n  if(!inJ()&&pl.jh&&pl.vy<-200)pl.vy=-200; // variable jump height\n  if(!inJ())pl.jh=false;\n }\n if(inA()&&pl.atk<=0&&pl.dash<=0&&!over){pl.atk=.3;pl.hit=false;snd(200,.12,'sawtooth',.04,-80)}\n pl.atk=Math.max(0,pl.atk-dt);\n const oy=pl.y;pl.x=Math.max(20,Math.min(W-20,pl.x+pl.vx*dt));pl.y+=pl.vy*dt;\n const ly=pl.vy>=0?solid(pl.x,pl.y,oy):null;\n if(ly!==null){pl.y=ly;pl.vy=0;pl.air=false}else pl.air=true;\n // nail hitbox follows the swing arc: active only in frames .06-.2 of .3\n if(pl.atk>0&&pl.atk<.24&&pl.atk>.1&&!pl.hit){\n  const hb={x:pl.face>0?pl.x+10:pl.x-90,y:pl.y-70,w:80,h:60};\n  if(hbBoss(hb)){pl.hit=true;bossHit(14);stop=.05;shake=4}\n  projs.forEach(p=>{if(p.x>hb.x&&p.x<hb.x+hb.w&&p.y>hb.y&&p.y<hb.y+hb.h)p.l=0}); // nail cuts orbs\n }\n}\nconst hbBoss=b=>bs.st!=='dead'&&bs.x+34>b.x&&bs.x-34<b.x+b.w&&bs.y+60>b.y&&bs.y-60<b.y+b.h;\nfunction hurt(){\n if(pl.inv>0||over)return;pl.hp--;pl.inv=1.1;pl.hurt=.25;pl.vx=-pl.face*260;pl.vy=-300;pl.air=true;stop=.12;shake=7;snd(110,.3,'square',.1,-60);\n for(let i=0;i<10;i++)spawn(pl.x,pl.y-40,rnd(-150,150),rnd(-200,0),.5,'#fff',2);\n if(pl.hp<=0){over=2;msg='YOU FELL TO THE LIGHT';parent.postMessage({cg2d:'lose'},'*')}\n}\nfunction collide(){\n const bx=pl.x-14,by=pl.y-70,bw=28,bh=70;\n projs.forEach(p=>{if(p.l>0&&p.x+p.r>bx&&p.x-p.r<bx+bw&&p.y+p.r>by&&p.y-p.r<by+bh){p.l=0;hurt()}});\n rays.forEach(r=>{if(r.on&&bx+bw>r.x-r.w/2&&bx<r.x+r.w/2)hurt()});\n if(bs.st==='act'&&bs.atk==='sweep'){ // horizontal beam on the ground: jump it\n   const yy=GY-30;if(by+bh>yy-18&&by<yy+18)hurt()}\n}\n\n// ---------- drawing: sprite states quantized to 12 fps (frame-stepped, not tweened) ----------\nfunction drawBoss(){\n const fr=Math.floor(T*12),x=bs.x+bs.sx*(bs.st==='intro'?0:1),y=bs.y;\n if(bs.st==='dead'&&bs.t>3.5){g.globalAlpha=Math.max(0,1-(bs.t-3.5)/1.5)}\n if(bs.st==='tpOut'||bs.st==='tpIn'){const k=bs.st==='tpOut'?1-bs.t/.25:bs.t/.25;g.globalAlpha=Math.max(0,Math.min(1,k))}\n g.save();g.translate(x,y);\n const hit=bs.flash>0,shiver=(bs.st==='trans'||bs.st==='dead')?(fr%2?3:-3):0;g.translate(shiver,0);\n const open=bs.st==='prep'?Math.min(1,bs.t/ATK[bs.atk].prep):bs.st==='act'?1:bs.st==='trans'?1:0;\n const col=hit?'#fff':bs.ph===3?'#fff3c8':'#ffe9a0';\n // radiating spikes \u2014 frame-stepped rotation, spread widens during prep/active/transition\n const n=bs.ph===1?14:bs.ph===2?18:24,len=70+open*60+Math.sin(fr*.9)*5;\n g.fillStyle=col;\n for(let i=0;i<n;i++){const a=i/n*Math.PI*2+fr*.07*(bs.ph===3?-1:1);\n  g.save();g.rotate(a);g.beginPath();g.moveTo(34,-5);g.lineTo(len,0);g.lineTo(34,5);g.fill();g.restore()}\n // glow core\n const gr=g.createRadialGradient(0,0,10,0,0,110+open*40);gr.addColorStop(0,'#fffbe8cc');gr.addColorStop(1,'#ffd96000');\n g.fillStyle=gr;g.beginPath();g.arc(0,0,150,0,7);g.fill();\n // body: crowned humanoid silhouette (flat sprite style)\n g.fillStyle=hit?'#fff':'#fff8dc';\n g.beginPath();g.ellipse(0,8,24,44,0,0,7);g.fill();             // torso\n g.beginPath();g.ellipse(0,-46,17,20,0,0,7);g.fill();           // head\n g.fillStyle='#1a1408';\n g.beginPath();g.ellipse(-6,-46,3,6,.2,0,7);g.ellipse(6,-46,3,6,-.2,0,7);g.fill(); // eyes\n g.fillStyle=col;g.beginPath();                                   // crown horns\n g.moveTo(-14,-60);g.lineTo(-20,-92-open*10);g.lineTo(-6,-64);g.lineTo(0,-98-open*12);g.lineTo(6,-64);g.lineTo(20,-92-open*10);g.lineTo(14,-60);g.fill();\n // arms: raised on prep, thrown forward on act, down on recover\n g.strokeStyle='#fff8dc';g.lineWidth=7;g.lineCap='round';\n const raise=bs.st==='prep'?-1:bs.st==='act'?.5:bs.st==='rec'?.9:.3+Math.sin(fr*.4)*.05;\n for(const s of[-1,1]){g.beginPath();g.moveTo(s*18,-18);g.lineTo(s*(44+open*8),-18+raise*60);g.stroke()}\n g.restore();g.globalAlpha=1;\n}\nfunction drawPlayer(){\n const fr=Math.floor(T*10);\n if(pl.inv>0&&Math.floor(T*20)%2&&!over)return;\n g.save();g.translate(pl.x,pl.y);g.scale(pl.face,1);\n if(over===2){g.rotate(1.4);}\n const run=Math.abs(pl.vx)>40&&!pl.air,bob=run?(fr%2?2:0):Math.sin(T*2)*1;\n g.fillStyle='#0b0d12';g.strokeStyle='#e8e4d8';g.lineWidth=2;\n const sq=pl.atk>.15?1.1:1;g.scale(1,sq);\n g.beginPath();g.ellipse(0,-30+bob,15,22,0,0,7);g.fill();g.stroke();       // body\n g.beginPath();g.ellipse(0,-58+bob,15,13,0,0,7);g.fill();g.stroke();       // head\n g.beginPath();g.moveTo(-9,-66+bob);g.lineTo(-13,-84+bob);g.lineTo(-3,-68+bob);g.moveTo(9,-66+bob);g.lineTo(13,-84+bob);g.lineTo(3,-68+bob);g.fill();g.stroke(); // horns\n g.fillStyle='#fff';g.fillRect(-9,-60+bob,5,5);g.fillRect(3,-60+bob,5,5); // eyes\n // legs\n const l=run?(fr%2?6:-6):0;g.strokeStyle='#e8e4d8';g.beginPath();g.moveTo(-6,-10);g.lineTo(-6+l,0);g.moveTo(6,-10);g.lineTo(6-l,0);g.stroke();\n g.restore();\n // nail swing arc, drawn across active frames\n if(pl.atk>0.05){const k=1-pl.atk/.3;g.save();g.translate(pl.x,pl.y-40);g.scale(pl.face,1);\n  g.strokeStyle='rgba(255,255,255,'+(1-k)+')';g.lineWidth=6;g.beginPath();g.arc(0,0,60,-1.1+k*.4,1.1*k+.2);g.stroke();g.restore()}\n}\n\n// ---------- parallax: back\u2192front, each layer shifts at its own rate ----------\nfunction layer(f,fn){g.save();g.translate(-camx*f,0);fn();g.restore()}\nfunction drawWorld(){\n const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#07080d');gr.addColorStop(.7,'#14121a');gr.addColorStop(1,'#1c1820');\n g.fillStyle=gr;g.fillRect(0,0,W,H);\n // L0 distant glow of the dream-realm sky (barely moves)\n layer(.05,()=>{const r=g.createRadialGradient(480,150,10,480,150,420);r.addColorStop(0,'#3a3350aa');r.addColorStop(1,'#00000000');g.fillStyle=r;g.fillRect(-100,0,W+200,H)});\n // L1 far silhouette spires\n layer(.15,()=>{g.fillStyle='#0e0f17';for(let i=-1;i<12;i++){const x=i*100,h=150+((i*37)%5)*40;g.beginPath();g.moveTo(x,GY);g.lineTo(x+14,GY-h);g.lineTo(x+28,GY);g.fill()}});\n // L2 mid arches / ruined colonnade\n layer(.4,()=>{g.fillStyle='#181824';for(let i=-1;i<6;i++){const x=i*200+30;g.fillRect(x,120,26,GY-120);g.fillRect(x+170,120,26,GY-120);g.beginPath();g.arc(x+98,130,85,Math.PI,0);g.lineTo(x+170,130);g.lineTo(x+26,130);g.fill()}});\n // floating motes behind gameplay\n // L3 gameplay layer\n g.fillStyle='#262230';g.fillRect(0,GY,W,H-GY);g.fillStyle='#3a3445';g.fillRect(0,GY,W,4);\n plats.forEach(p=>{g.fillStyle='#2e2a3a';g.fillRect(p.x,p.y,p.w,12);g.fillStyle='#4a4358';g.fillRect(p.x,p.y,p.w,3)});\n}\nfunction drawFront(){\n // L4 foreground: dark hanging roots/thorns + dust, moves faster than gameplay\n layer(1.35,()=>{g.fillStyle='#050508';for(let i=-1;i<9;i++){const x=i*130+20;g.beginPath();g.moveTo(x,0);g.quadraticCurveTo(x+20,70+((i*53)%4)*20,x+8,150+((i*29)%3)*30);g.lineTo(x+14,0);g.fill()}\n  g.fillRect(-50,H-22,W+100,22)});\n}\nfunction drawAttacks(){\n // telegraphs always precede damage\n if(bs.st==='prep'){const k=bs.t/ATK[bs.atk].prep;\n  if(bs.atk==='rays')rays.forEach(r=>{g.fillStyle='rgba(255,240,170,'+(.15+k*.5)+')';g.fillRect(r.x-2,0,4,GY)});\n  if(bs.atk==='sweep'){g.fillStyle='rgba(255,240,170,'+(.1+k*.4)+')';g.fillRect(0,GY-32,W,3)}}\n if(bs.st==='act'){\n  rays.forEach(r=>{if(r.on){g.fillStyle='#fff8d8';g.fillRect(r.x-r.w/2,0,r.w,GY);g.fillStyle='#ffe38a88';g.fillRect(r.x-r.w,0,r.w*2,GY)}});\n  if(bs.atk==='sweep'){g.fillStyle='#fff8d8';g.fillRect(0,GY-36,W,12);g.fillStyle='#ffe38a66';g.fillRect(0,GY-48,W,36)}}\n projs.forEach(p=>{g.fillStyle='#ffe9a0';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,p.r*.5,0,7);g.fill()});\n parts.forEach(p=>{g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x,p.y,p.r,p.r)});g.globalAlpha=1;\n}\nfunction ui(){\n g.fillStyle='#fff';for(let i=0;i<5;i++){g.globalAlpha=i<pl.hp?1:.2;g.beginPath();g.ellipse(34+i*30,34,10,13,0,0,7);g.fill()}g.globalAlpha=1;\n if(bs.st!=='intro'){g.fillStyle='#ffffff22';g.fillRect(180,H-34,600,8);g.fillStyle='#ffe9a0';g.fillRect(180,H-34,600*bs.hp/bs.max,8);\n  g.fillStyle='#e8e4d8';g.font='16px Georgia';g.textAlign='center';g.fillText('Absolute Radiance',W/2,H-44)}\n if(bs.st==='intro'&&bs.t>2){g.fillStyle='#fff';g.font='34px Georgia';g.textAlign='center';g.globalAlpha=Math.min(1,bs.t-2);g.fillText('Absolute Radiance',W/2,100);g.globalAlpha=1}\n if(msg){g.fillStyle='#fff';g.font='28px Georgia';g.textAlign='center';g.fillText(msg,W/2,H/2-120);\n  if(over){g.font='16px Georgia';g.fillText('Press R or tap to try again',W/2,H/2-90)}}\n}\n\n// ---------- loop ----------\nlet last=performance.now();\nfunction reset(){Object.assign(pl,{x:200,y:GY,vx:0,vy:0,hp:5,inv:0,atk:0,dash:0,dcd:0,hurt:0});Object.assign(bs,{x:700,hp:700,ph:1,flash:0,dead:0});projs=[];rays=[];parts=[];over=0;msg='';setS('intro',0)}\naddEventListener('keydown',e=>{if(e.code==='KeyR'&&over)reset();if(e.code==='Escape')parent.postMessage({cg2d:'exit'},'*')});\ncv.addEventListener('pointerdown',()=>{if(over)reset()});\nfunction frame(now){\n let dt=Math.min(.033,(now-last)/1000);last=now;\n if(stop>0){stop-=dt;dt*=.05}\n T+=dt;\n if(bs.st!=='trans'&&bs.st!=='intro'||true){updPlayer(dt)}\n updBoss(dt);\n projs.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.y>GY+10||p.x<-20||p.x>W+20)p.l=0});projs=projs.filter(p=>p.l>0);\n parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);\n if(bs.st!=='trans'&&bs.st!=='intro'&&bs.st!=='dead')collide();\n shake*=.88;camx+=((pl.x-W/2)*.25-camx)*Math.min(1,dt*4);\n // camera: slight pull-in during transition, subtle shake\n const zoom=bs.st==='trans'?1.06:1;\n g.save();g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);\n g.translate(W/2+rnd(-shake,shake),H/2+rnd(-shake,shake));g.scale(zoom,zoom);g.translate(-W/2,-H/2);\n drawWorld();drawAttacks();drawBoss();drawPlayer();drawFront();g.restore();ui();\n requestAnimationFrame(frame);\n}\nsetS('intro',0);\nrequestAnimationFrame(frame);\n<\/script>\n<\/body><\/html>\n";
(function(){let fr=null;
 const close=()=>{if(fr){fr.remove();fr=null}};
 const pl=G.load.bind(G);
 G.load=function(i){const idx=mode==='story'?Math.min(SY.i,N-1):i;
  if(BOSSES[idx].id!=='radiance')return pl(i);
  close();G.bi=idx;G.time=0;G.dc=G.dc||0;G.st='fight2d';UI.show(null);
  document.body.classList.remove('fight');$('#end').classList.remove('on');
  fr=document.createElement('iframe');fr.srcdoc=RAD2D;
  fr.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:99999;background:#000';
  document.body.appendChild(fr);fr.focus();};
 addEventListener('message',e=>{const d=e.data;if(!d||!d.cg2d||!fr)return;
  if(d.cg2d==='win'){close();G.time=d.t||0;G.win()}
  else if(d.cg2d==='lose'){close();G.lose()}
  else if(d.cg2d==='exit'){close();G.st='menu';mode==='story'?showStory():UI.select()}});
})();
